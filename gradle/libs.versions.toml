[versions]
agp = "8.12.1"
androidutils = "0.4.6"
androidx-activity-compose = "1.10.1"
androidxNavigation = "2.9.3"
# @keep
compileSdk = "36"
compose-lint-checks = "1.4.2"
compose-material3 = "1.3.2"
compose-tooling = "1.9.0"
composed = "0.0.7-rc1"
datastoreutils = "0.0.7-rc2"
hilt = "2.57.1"
hiltNavigationCompose = "1.2.0"
# @keep
java = "17"
junit = "4.13.2"
kotlin = "2.2.10"
kotlinxCollectionsImmutable = "0.4.0"
ksp = "2.2.10-2.0.2"
ktlint = "13.1.0"
lifecycle = "2.9.2"
# @keep
minSdk = "26"
opencv = "4.12.0"
triplet-play = "3.12.1"
versionCatalogUpdate = "1.0.0"

[libraries]
# @keep
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity-compose" }
androidx-appcompat = "androidx.appcompat:appcompat:1.7.1"
androidx-compose-activity = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-tooling" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose-tooling" }
androidx-compose-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-core = "androidx.core:core-ktx:1.17.0"
androidx-datastore-preferences = "androidx.datastore:datastore-preferences:1.1.7"
androidx-fragment = "androidx.fragment:fragment-ktx:1.8.9"
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-navigation-fragment = { module = "androidx.hilt:hilt-navigation-fragment", version.ref = "hiltNavigationCompose" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-livedata-core-ktx = { module = "androidx.lifecycle:lifecycle-livedata-core-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "androidxNavigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "androidxNavigation" }
androidx-splashscreen = "androidx.core:core-splashscreen:1.0.1"
androidx-test-ext-junit = "androidx.test.ext:junit:1.3.0"
androidx-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-viewpager2 = "androidx.viewpager2:viewpager2:1.1.0"
animatoo = "com.github.mohammadatif:Animatoo:1.0.1"
compose-lint-checks = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "compose-lint-checks" }
google-guava = "com.google.guava:guava:33.4.8-jre"
google-hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
google-hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
google-material = "com.google.android.material:material:1.12.0"
junit = { module = "junit:junit", version.ref = "junit" }
# @keep
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
# @keep
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
airbnb-lottie-compose = "com.airbnb.android:lottie-compose:6.6.7"
opencv = { module = "org.opencv:opencv", version.ref = "opencv" }
simplestorage = "com.anggrayudi:storage:2.2.0"
# other
slimber = "com.github.PaulWoitaschek:Slimber:2.0.0"
snacky = "com.github.matecode:Snacky:1.1.6"
w2sv-androidutils-core = { module = "com.github.w2sv.AndroidUtils:core", version.ref = "androidutils" }
w2sv-androidutils-lifecycle = { module = "com.github.w2sv.AndroidUtils:lifecycle", version.ref = "androidutils" }
w2sv-androidutils-view = { module = "com.github.w2sv.AndroidUtils:views", version.ref = "androidutils" }
w2sv-bidirectionalviewpager = "com.github.w2sv:BidirectionalViewPager:0.0.2-rc1"
w2sv-composed = { module = "com.github.w2sv.Composed:composed", version.ref = "composed" }
w2sv-datastoreutils-preferences = { module = "com.github.w2sv.DataStoreUtils:preferences", version.ref = "datastoreutils" }
w2sv-kotlindelegates = "com.github.w2sv:Kotlin-Delegates:0.0.1-rc1"
w2sv-kotlinutils = "com.github.w2sv:KotlinUtils:0.1.9"
w2sv-permissionhandler = "com.github.w2sv:PermissionHandler:1.1.0-rc1"
w2sv-viewanimations = "com.github.w2sv:AndroidViewAnimations:3.0.2-rc2"
w2sv-viewboundcontroller = "com.github.w2sv:ViewboundController:0.0.7-rc1"

[bundles]
unitTest = [
    "androidx-test-ext-junit",
    "junit",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
androidx-navigation-safeargs-kotlin = { id = "androidx.navigation.safeargs.kotlin", version.ref = "androidxNavigation" }
# @keep
autocrop-application = { id = "autocrop.application" }
# @keep
autocrop-hilt = { id = "autocrop.hilt" }
# @keep
autocrop-library = { id = "autocrop.library" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
play = { id = "com.github.triplet.play", version.ref = "triplet-play" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
